<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#050816" />
  <meta name="color-scheme" content="dark" />

  <title>Орбита · Карманная космогония</title>
  <meta name="description" content="Процедурно сгенерированная мини-вселенная: звезда, планеты, кометы, лоции. Каждая система — единственная в своём роде." />

  <meta property="og:title" content="Орбита — карманная космогония" />
  <meta property="og:description" content="Каждое нажатие R рождает новый мир." />
  <meta property="og:type" content="website" />

  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='3' fill='%23ffd28a'/><ellipse cx='16' cy='16' rx='13' ry='5' stroke='%238a9bff' stroke-width='0.8' fill='none' opacity='0.7'/><circle cx='29' cy='13' r='1.6' fill='%238a9bff'/></svg>" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..500&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="assets/styles/cosmos.css" />
</head>
<body>

  <canvas data-cosmos aria-label="Звёздная карта"></canvas>

  <header class="hud" data-hud>
    <div class="hud__brand">
      <svg class="hud__mark" width="26" height="26" viewBox="0 0 26 26" aria-hidden="true">
        <circle cx="13" cy="13" r="2.6" fill="currentColor" opacity="0.95" />
        <ellipse cx="13" cy="13" rx="11" ry="3.6" stroke="currentColor" stroke-width="0.7" fill="none" opacity="0.5" />
        <ellipse cx="13" cy="13" rx="6.2" ry="2" stroke="currentColor" stroke-width="0.7" fill="none" opacity="0.7" />
        <circle cx="24" cy="10" r="1.4" fill="currentColor" opacity="0.9" />
      </svg>
      <div class="hud__brand-text">
        <h1 class="hud__title">Орбита</h1>
        <p class="hud__subtitle">Карманная космогония</p>
      </div>
    </div>
    <div class="hud__seed">
      <span class="hud__label">Семя</span>
      <span class="mono" data-seed>—</span>
      <button class="hud__reseed" data-reseed aria-label="Новая система (R)">
        <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true">
          <path d="M2.5 6 a3.5 3.5 0 1 1 1 2.5" stroke="currentColor" stroke-width="1.1" fill="none" stroke-linecap="round"/>
          <path d="M2 4 L2.5 6 L4.5 5.5" stroke="currentColor" stroke-width="1.1" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span>R</span>
      </button>
    </div>
  </header>

  <aside class="time" data-time>
    <div class="time__date">
      <span class="hud__label">Звёздная дата</span>
      <span class="mono time__value" data-stardate>Y0000.0</span>
    </div>
    <div class="time__speeds" role="group" aria-label="Скорость времени">
      <button class="speed" data-speed="0" aria-label="Пауза">
        <svg width="9" height="10" viewBox="0 0 9 10" aria-hidden="true"><rect x="1" y="1" width="2" height="8" fill="currentColor"/><rect x="6" y="1" width="2" height="8" fill="currentColor"/></svg>
      </button>
      <button class="speed is-active" data-speed="1">1×</button>
      <button class="speed" data-speed="10">10×</button>
      <button class="speed" data-speed="100">100×</button>
      <button class="speed" data-speed="1000">1000×</button>
    </div>
  </aside>

  <aside class="panel" data-panel aria-hidden="true">
    <button class="panel__close" data-panel-close aria-label="Закрыть лоцию">
      <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true">
        <path d="M3 3 L11 11 M11 3 L3 11" stroke="currentColor" stroke-width="1.2" fill="none" stroke-linecap="round"/>
      </svg>
    </button>

    <header class="panel__head">
      <div class="panel__crumb mono">
        <span data-panel-index>—</span>
        <span class="panel__sep">·</span>
        <span data-panel-kind>—</span>
      </div>
      <h2 class="panel__name" data-panel-name>—</h2>
      <p class="panel__epithet" data-panel-epithet>—</p>
    </header>

    <figure class="panel__planet">
      <canvas data-panel-canvas width="256" height="256" aria-hidden="true"></canvas>
    </figure>

    <dl class="panel__stats">
      <div><dt>Орбита</dt><dd data-stat="orbit">—</dd></div>
      <div><dt>Год</dt><dd data-stat="year">—</dd></div>
      <div><dt>Радиус</dt><dd data-stat="radius">—</dd></div>
      <div><dt>Гравитация</dt><dd data-stat="gravity">—</dd></div>
      <div><dt>Атмосфера</dt><dd data-stat="atmosphere">—</dd></div>
      <div><dt>Температура</dt><dd data-stat="temperature">—</dd></div>
      <div><dt>Спутники</dt><dd data-stat="moons">—</dd></div>
      <div><dt>Население</dt><dd data-stat="population">—</dd></div>
    </dl>

    <article class="panel__lore" data-panel-lore>—</article>

    <footer class="panel__foot mono">
      <span data-panel-coords>—</span>
    </footer>
  </aside>

  <footer class="legend" data-legend>
    <span class="legend__item"><kbd>Клик</kbd> по телу — лоция</span>
    <span class="legend__sep">·</span>
    <span class="legend__item"><kbd>R</kbd> — новая система</span>
    <span class="legend__sep">·</span>
    <span class="legend__item"><kbd>Esc</kbd> — закрыть</span>
    <span class="legend__sep">·</span>
    <span class="legend__item"><kbd>Space</kbd> — пауза</span>
  </footer>

  <div class="curtain" data-curtain aria-hidden="true">
    <div class="curtain__inner">
      <span class="curtain__line">формирование пыли</span>
      <span class="curtain__line">слипание ядер</span>
      <span class="curtain__line">розжиг звезды</span>
    </div>
  </div>

  <script src="assets/scripts/orbita.js" defer></script>
</body>
</html>
